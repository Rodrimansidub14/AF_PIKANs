name: ci
on: [push, pull_request]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.3.2 pytest==9.1.1
      - name: Convenciones, registro y secretos
        run: python tools/check_repo.py
      - name: Las cifras citadas salen de los datos guardados
        run: python tools/reproduce_numbers.py
      - name: La traza está al día
        run: python tools/build_trace.py && git diff --exit-code experiments/TRAZA.md experiments/status.json
